<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PricePulse - Price Comparison</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            Price<span>Pulse</span>
        </div>

        <p>
            Compare prices across multiple platforms
        </p>

    </header>


    <!-- SEARCH -->

    <main>

        <div class="search-container">

            <input
                type="text"
                id="searchInput"
                placeholder="Search for a product..."
                onkeydown="handleEnter(event)"
            >

            <button onclick="searchProducts()">
                Search
            </button>

        </div>


        <!-- RESULTS -->

        <div id="results"></div>

    </main>


    <script
        src="{{ url_for('static', filename='js/app.js') }}">
    </script>

</body>

</html>
