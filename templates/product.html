<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PricePulse - Product Comparison</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

    <!-- HEADER -->

    <header class="product-hero">

        <div class="product-hero-content">

            <a href="/" class="back-home">
                ← Back to PricePulse
            </a>

            <div class="logo">
                Price<span>Pulse</span>
            </div>

            <p>
                Compare this product across available platforms
            </p>

        </div>

    </header>


    <!-- MAIN -->

    <main class="product-main">

        <div id="productDetails">

            <div class="message-card">

                <div class="loader"></div>

                <h3>
                    Loading product...
                </h3>

                <p>
                    Please wait while we compare available offers.
                </p>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="footer-logo">
            Price<span>Pulse</span>
        </div>

        <p>
            Compare. Discover. Save.
        </p>

    </footer>


    <script
        src="{{ url_for('static', filename='js/product.js') }}">
    </script>

</body>

</html>
